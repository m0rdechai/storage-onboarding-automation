# OpenShift / RHCOS - IBM, Pure and NetApp
defaults {
    user_friendly_names yes
    find_multipaths yes
}

devices {
    # IBM FlashSystem 7300
    # no_path_retry 5 and dev_loss_tmo 120 are intentional. A dead path
    # fails instead of queueing forever.
    device {
        vendor               "IBM"
        product              "2145"
        path_grouping_policy "group_by_prio"
        prio                 "alua"
        path_checker         "tur"
        path_selector        "service-time 0"
        failback             "immediate"
        no_path_retry        5
        rr_weight            "uniform"
        rr_min_io_rq         1
        fast_io_fail_tmo     5
        dev_loss_tmo         120
    }

    # Pure Storage FlashArray
    # no_path_retry 0 is intentional. A dead path is not retried.
    device {
        vendor               "PURE"
        product              "FlashArray"
        path_grouping_policy "group_by_prio"
        prio                 "alua"
        path_checker         "tur"
        path_selector        "service-time 0"
        failback             "immediate"
        no_path_retry        0
        rr_weight            "uniform"
        fast_io_fail_tmo     10
        dev_loss_tmo         60
    }

    # NetApp AFF A300 / ASA A70
    # Use the built-in ONTAP profile so this file has one devices section.
    # No explicit override required.
}
